name: mo-eval suite
on:
  workflow_dispatch:
    inputs:
      arms:
        description: Models to evaluate, space-separated ("none" = build the suite only)
        default: "none"
      harnesses:
        description: Coding-agent harnesses, space-separated (mo, cc, pi, strands, codex)
        default: "mo"
      dry-run:
        description: Mine and select only, print the funnel, run nothing
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: read
  id-token: write   # the job authenticates to mo-eval as this repository; no secret to manage
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The job runs the repository's own historical tests; keep the forge token off disk.
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # go.mod says 1.18 (the floor lo supports); match the worker image instead.
          go-version: "1.27"
      - uses: momentohq/mo-eval-action@v1
        with:
          arms: ${{ inputs.arms }}
          harnesses: ${{ inputs.harnesses }}
          dry-run: ${{ inputs.dry-run }}
